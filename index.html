<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Texas Hold'em — Multiplayer</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="peerjs.min.js" defer></script>
    <script src="game.js" defer></script>
  </head>
  <body>
    <!-- LOBBY / JOIN SCREEN -->
    <div id="lobby" class="lobby-overlay">
      <div class="lobby-card">
        <h1>Texas Hold'em</h1>
        <p class="subtitle">Multiplayer 德州扑克 · 8 人同乐</p>

        <div class="lobby-tabs">
          <button class="tab active" data-tab="create">创建房间</button>
          <button class="tab" data-tab="join">加入房间</button>
        </div>

        <!-- Create -->
        <div id="createPanel" class="lobby-panel active">
          <input type="text" id="nameInputCreate" placeholder="你的名字" maxlength="12" />
          <button id="createRoomBtn" class="primary-btn">创建房间并开始</button>
        </div>

        <!-- Join -->
        <div id="joinPanel" class="lobby-panel">
          <input type="text" id="nameInputJoin" placeholder="你的名字" maxlength="12" />
          <input type="text" id="roomIdInput" placeholder="房间号（6位大写字母数字）" maxlength="8" />
          <button id="joinRoomBtn" class="primary-btn">加入房间</button>
        </div>

        <p id="lobbyMessage" style="margin:16px 0 0;color:var(--muted);font-size:0.85rem;">创建或加入房间开始游戏</p>
      </div>
    </div>

    <!-- GAME UI -->
    <div id="gameUI" class="app-shell hidden">
      <!-- Hero Bar -->
      <header class="hero-bar">
        <div>
          <p class="eyebrow">Texas Hold'em</p>
          <h1>德州扑克桌</h1>
        </div>
        <div class="room-info">
          <span class="room-id-label">房间</span>
          <strong id="roomIdDisplay">---</strong>
          <button id="copyRoomBtn" title="复制房间链接">&#x1F4CB;</button>
          <button id="settingsBtn" class="icon-btn hidden" title="游戏设置">&#x2699;</button>
          <span id="connectionStatus" class="status-dot connected" title="连接状态"></span>
        </div>
        <div class="stats-grid">
          <div class="stat">
            <span>局数</span>
            <strong id="handNumber">0</strong>
          </div>
          <div class="stat">
            <span>底池</span>
            <strong id="potValue">0</strong>
          </div>
          <div class="stat">
            <span>阶段</span>
            <strong id="phaseName">等待中</strong>
          </div>
          <div class="stat">
            <span>盲注</span>
            <strong id="blindsDisplay">10/20</strong>
          </div>
        </div>
      </header>

      <!-- Poker Table -->
      <section class="table-wrap" aria-label="牌桌">
        <div class="table-glow"></div>
        <div class="poker-table" id="pokerTable">
          <div class="center-stage">
            <div class="pot-chip">
              <span>底池</span>
              <strong id="centerPot">0</strong>
            </div>
            <div class="community" id="communityCards" aria-label="公共牌"></div>
            <div class="message" id="message">加载中…</div>
          </div>
        </div>
      </section>

      <!-- Action Panel -->
      <section class="control-panel" aria-label="操作区">
        <div class="result-strip">
          <span id="handInfo">等待发牌</span>
          <span id="actionTimer"></span>
        </div>
        <div class="actions" id="actionPanel">
          <button id="startBtn" class="action-btn accent">开始游戏</button>
          <button id="nextHandBtn" class="action-btn accent hidden">下一局</button>
          <button id="foldBtn" class="action-btn danger hidden">弃牌</button>
          <button id="checkBtn" class="action-btn hidden">过牌</button>
          <button id="callBtn" class="action-btn hidden">跟注</button>
          <div id="raiseArea" class="raise-area hidden">
            <input type="range" id="raiseSlider" min="20" max="1000" step="10" />
            <button id="raiseBtn" class="action-btn">加注到 <span id="raiseAmount">20</span></button>
          </div>
          <button id="allInBtn" class="action-btn danger hidden">All-in</button>
          <button id="rebuyBtn" class="action-btn accent hidden">&#x267B; 买入筹码</button>
        </div>
        <ol class="event-log" id="eventLog"></ol>
      </section>
    </div>

    <!-- SETTINGS PANEL (host only) -->
    <div id="settingsPanel" class="settings-overlay hidden">
      <div class="settings-card">
        <div class="settings-header">
          <h3>游戏设置</h3>
          <button id="closeSettingsPanel" class="settings-close">&times;</button>
        </div>
        <div class="settings-body">
          <label class="settings-field">
            <span>小盲</span>
            <input type="number" id="sbSetting" min="2" max="500" value="10" />
          </label>
          <label class="settings-field">
            <span>大盲</span>
            <input type="number" id="bbSetting" min="4" max="5000" value="20" />
          </label>
          <label class="settings-field">
            <span>买入筹码</span>
            <input type="number" id="rebuySetting" min="20" max="100000" step="100" value="1000" />
          </label>
        </div>
        <p id="settingsError" class="settings-error hidden">验证错误</p>
        <button id="applySettings" class="primary-btn">应用设置</button>
      </div>
    </div>
  </body>
</html>
